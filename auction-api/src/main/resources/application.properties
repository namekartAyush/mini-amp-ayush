spring.application.name=auction-api

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/mini_amp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=amp_user
spring.datasource.password=amppassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Actuator Health Endpoint Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Registrar Configuration
registrar.default-provider=dynadot
registrar.dynadot.api-key=${REGISTRAR_DYNADOT_API_KEY:mock-key}
registrar.dynadot.base-url=${REGISTRAR_DYNADOT_BASE_URL:https://api.dynadot.com/api3.json}
registrar.dynadot.timeout=5s
registrar.godaddy.api-key=${REGISTRAR_GODADDY_API_KEY:godaddy-key}
registrar.godaddy.api-secret=${REGISTRAR_GODADDY_API_SECRET:godaddy-secret}
registrar.godaddy.base-url=${REGISTRAR_GODADDY_BASE_URL:https://api.godaddy.com}