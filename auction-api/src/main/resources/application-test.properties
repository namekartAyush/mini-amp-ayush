# ==========================================
# Test Profile (test)
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test Pool Settings
app.datasource.pool-size=5
app.datasource.connection-timeout=10s
app.datasource.idle-timeout=5m
spring.datasource.hikari.maximum-pool-size=${app.datasource.pool-size}

# JPA Settings for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.stat=DEBUG

# Registrar Configuration for Tests
registrar.default-provider=dynadot
registrar.dynadot.api-key=test-key
registrar.dynadot.base-url=https://api.dynadot.com/api3.json
registrar.dynadot.timeout=5s
