spring.application.name=auction-api-test

# In-memory H2 database for test execution with MySQL compatibility
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Connection Pool Configuration
app.datasource.pool-size=10
app.datasource.connection-timeout=30s
app.datasource.idle-timeout=10m

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.stat=DEBUG


# Registrar Configuration for Tests
registrar.default-provider=dynadot
registrar.dynadot.api-key=test-key
registrar.dynadot.base-url=https://api.dynadot.com/api3.json
registrar.dynadot.timeout=5s

# Kafka Test Settings: Disable automatic listener container startup and KafkaAdmin auto-create in non-kafka unit tests
app.kafka.listener.auto-startup=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
spring.kafka.producer.properties.max.block.ms=200
# Actuator & Prometheus for Tests
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true



