spring.application.name=auction-api

# Default Profile (Override with SPRING_PROFILES_ACTIVE=prod or --spring.profiles.active=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Common Default Pool Configuration
app.datasource.pool-size=${APP_DATASOURCE_POOL_SIZE:10}
app.datasource.connection-timeout=30s
app.datasource.idle-timeout=10m

# Common Actuator & Prometheus Metrics Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# L8 Structured JSON Logging (Spring Boot 3.4 native console format with MDC traceId)
logging.structured.format.console=json

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Kafka Common Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer