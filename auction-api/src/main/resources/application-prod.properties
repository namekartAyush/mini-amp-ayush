# ==========================================
# Production Profile (prod)
# Reads DB password from mounted file via configtree,
# and all other runtime parameters from environment variables.
# ==========================================
spring.config.import=optional:configtree:/run/secrets/,optional:configtree:secrets/

# Database Connection via Environment Variables
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:mini_amp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:amp_user}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Password loaded from mounted secret file (/run/secrets/db-password)
spring.datasource.password=${db-password:${db_password:${DB_PASSWORD}}}

# Connection Pool via Environment Variables
app.datasource.pool-size=${APP_DATASOURCE_POOL_SIZE:20}
app.datasource.connection-timeout=${APP_DATASOURCE_CONNECTION_TIMEOUT:30s}
app.datasource.idle-timeout=${APP_DATASOURCE_IDLE_TIMEOUT:10m}
spring.datasource.hikari.maximum-pool-size=${app.datasource.pool-size}

# Production JPA Settings (Strict validation, no DDL auto generation)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
logging.level.root=WARN
logging.level.com.namekart=INFO

# Registrar Configuration strictly enforced via Environment Variables
registrar.default-provider=${REGISTRAR_DEFAULT_PROVIDER:dynadot}
registrar.dynadot.api-key=${REGISTRAR_DYNADOT_API_KEY}
registrar.dynadot.base-url=${REGISTRAR_DYNADOT_BASE_URL}
registrar.dynadot.timeout=${REGISTRAR_DYNADOT_TIMEOUT:5s}
registrar.godaddy.api-key=${REGISTRAR_GODADDY_API_KEY:}
registrar.godaddy.api-secret=${REGISTRAR_GODADDY_API_SECRET:}
registrar.godaddy.base-url=${REGISTRAR_GODADDY_BASE_URL:https://api.godaddy.com}
